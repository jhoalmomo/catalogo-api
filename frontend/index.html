<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - API REST (JSON)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos CSS propios -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-dark text-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary px-4 py-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Catálogo API REST</span>
            <div id="auth-seccion">
                <button class="btn btn-outline-info btn-sm" data-bs-toggle="modal" data-bs-target="#modalLogin" id="btn-abrir-login">Iniciar Sesión</button>
                <div id="panel-sesion" class="d-none align-items-center gap-2">
                    <span class="badge bg-success">Admin Conectado (JWT)</span>
                    <button class="btn btn-outline-danger btn-sm" id="btn-logout">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventario de Productos</h2>
            <button class="btn btn-primary d-none" id="btn-nuevo-producto" data-bs-toggle="modal" data-bs-target="#modalProducto">
                + Agregar Producto
            </button>
        </div>

        <div id="alerta-publica" class="alert alert-secondary py-2">
            Modo visualización pública. Para crear, editar o eliminar registros, inicie sesión con su token JWT.
        </div>

        <!-- Tabla de productos -->
        <div class="table-responsive card bg-secondary-subtle border-secondary p-3">
            <table class="table table-dark table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    <!-- Renderizado dinámico desde app.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal fade" id="modalLogin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Autenticación (JWT)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Usuario:</label>
                        <input type="text" id="login-user" class="form-control bg-secondary text-light border-0" placeholder="Nombre de usuario">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <input type="password" id="login-pass" class="form-control bg-secondary text-light border-0" placeholder="Contraseña">
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-info" id="btn-submit-login">Ingresar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear / Editar Producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="modal-producto-titulo">Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="prod-id">
                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" id="prod-nombre" class="form-control bg-secondary text-light border-0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio:</label>
                        <input type="number" id="prod-precio" step="0.01" class="form-control bg-secondary text-light border-0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock:</label>
                        <input type="number" id="prod-stock" class="form-control bg-secondary text-light border-0" required>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-guardar-producto">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
